<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoleplattform</title>
    <style>
        /* Generell stil */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f4f8;
        }

        header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
        }

        input, select, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #357ab8;
        }

        .hidden {
            display: none;
        }

        .menu button {
            width: 48%;
            margin: 1%;
        }

        .quiz, .gloser, .chat {
            margin-top: 20px;
        }

        .question {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Skoleplattform for elever</h1>
    </header>

    <div class="container" id="register-section">
        <h2>Opprett bruker</h2>
        <input type="text" id="username" placeholder="Skriv inn brukernavn">
        <select id="grade">
            <option value="1-4">1-4 trinn</option>
            <option value="5-7">5-7 trinn</option>
            <option value="8-10">8-10 trinn</option>
            <option value="vg1-vg3">VG1-VG3</option>
        </select>
        <button onclick="registerUser()">Fortsett</button>
    </div>

    <div class="container hidden" id="menu-section">
        <h2>Velg funksjon</h2>
        <div class="menu">
            <button onclick="showSection('chat')">AI Chat</button>
            <button onclick="showSection('gloser')">Gloseprøve</button>
            <button onclick="showSection('quiz')">Quiz</button>
        </div>
    </div>

    <!-- AI Chat -->
    <div class="container hidden" id="chat-section">
        <h2>AI Chat - spør om skolefag</h2>
        <textarea id="chat-input" placeholder="Skriv spørsmål her..." rows="3"></textarea>
        <button onclick="askChat()">Spør</button>
        <div id="chat-output" style="margin-top:10px; border:1px solid #ccc; padding:10px; border-radius:5px; min-height:50px;"></div>
    </div>

    <!-- Gloseprøve -->
    <div class="container hidden" id="gloser-section">
        <h2>Gloseprøve</h2>
        <input type="text" id="word-input" placeholder="Skriv ord du vil øve på, kommaseparert">
        <button onclick="startGlose()">Start øving</button>
        <div id="gloser-output" style="margin-top:10px;"></div>
    </div>

    <!-- Quiz -->
    <div class="container hidden" id="quiz-section">
        <h2>Quiz</h2>
        <select id="subject">
            <option value="matematikk">Matematikk</option>
            <option value="norsk">Norsk</option>
            <option value="engelsk">Engelsk</option>
            <option value="naturfag">Naturfag</option>
        </select>
        <button onclick="startQuiz()">Start Quiz</button>
        <div id="quiz-output" style="margin-top:10px;"></div>
    </div>

    <script>
        let username = '';
        let grade = '';

        function registerUser() {
            username = document.getElementById('username').value;
            grade = document.getElementById('grade').value;

            if(username === '') {
                alert('Skriv inn et brukernavn');
                return;
            }

            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
        }

        function showSection(section) {
            document.getElementById('chat-section').classList.add('hidden');
            document.getElementById('gloser-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.add('hidden');

            if(section === 'chat') document.getElementById('chat-section').classList.remove('hidden');
            if(section === 'gloser') document.getElementById('gloser-section').classList.remove('hidden');
            if(section === 'quiz') document.getElementById('quiz-section').classList.remove('hidden');
        }

        // Enkel AI Chat simulering
        function askChat() {
            const question = document.getElementById('chat-input').value;
            const output = document.getElementById('chat-output');

            if(question === '') {
                alert('Skriv et spørsmål');
                return;
            }

            // Her kan man koble til en ekte AI senere
            output.innerHTML += `<p><b>${username}:</b> ${question}</p>`;
            output.innerHTML += `<p><b>AI:</b> Dette er et eksempel-svar for ${grade} trinn.</p>`;
            document.getElementById('chat-input').value = '';
        }

        // Gloseprøve funksjon
        let words = [];
        let currentWord = 0;

        function startGlose() {
            const input = document.getElementById('word-input').value;
            if(input === '') return alert('Skriv inn ord');

            words = input.split(',').map(w => w.trim());
            currentWord = 0;
            showNextWord();
        }

        function showNextWord() {
            if(currentWord >= words.length) {
                document.getElementById('gloser-output').innerHTML = '<p>Du har øvd på alle ordene!</p>';
                return;
            }
            const word = words[currentWord];
            document.getElementById('gloser-output').innerHTML = `
                <p>Hva er betydningen av: <b>${word}</b> ?</p>
                <input type='text' id='answer'>
                <button onclick='checkAnswer()'>Sjekk svar</button>
            `;
        }

        function checkAnswer() {
            const answer = document.getElementById('answer').value;
            // Ingen sjekk implementert, bare fortsetter
            currentWord++;
            showNextWord();
        }

        // Quiz funksjon
        const sampleQuestions = {
            matematikk: [
                {q: 'Hva er 2 + 2?', a: '4'},
                {q: 'Hva er 5 * 6?', a: '30'}
            ],
            norsk: [
                {q: 'Hva heter hovedstaden i Norge?', a: 'Oslo'},
                {q: 'Hva er synonym for "glad"?', a: 'lykkelig'}
            ],
            engelsk: [
                {q: 'Translate: cat', a: 'katt'},
                {q: 'Translate: house', a: 'hus'}
            ],
            naturfag: [
                {q: 'Hva heter prosessen der planter lager mat?', a: 'Fotosyntese'},
                {q: 'Hva er vannets kjemiske formel?', a: 'H2O'}
            ]
        };

        let quizIndex = 0;
        let currentQuiz = [];

        function startQuiz() {
            const subject = document.getElementById('subject').value;
            currentQuiz = sampleQuestions[subject];
            quizIndex = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            if(quizIndex >= currentQuiz.length) {
                document.getElementById('quiz-output').innerHTML = '<p>Du har fullført quizen!</p>';
                return;
            }

            const q = currentQuiz[quizIndex];
            document.getElementById('quiz-output').innerHTML = `
                <div class='question'>${q.q}</div>
                <input type='text' id='quiz-answer'>
                <button onclick='checkQuizAnswer()'>Sjekk svar</button>
            `;
        }

        function checkQuizAnswer() {
            const userAnswer = document.getElementById('quiz-answer').value.trim();
            const correctAnswer = currentQuiz[quizIndex].a;

            if(userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
                alert('Riktig!');
            } else {
                alert('Feil! Riktig svar: ' + correctAnswer);
            }
            quizIndex++;
            showQuizQuestion();
        }

    </script>
</body>
</html>
